# Приложение ПДД PRO для Android — сборка без подписи (24.11.2026).
# Готовит tools/pdd_app.py в закрытом репозитории avtoelektrik-src; подпись — там же (tools/pdd_app_sign.py), ключей здесь нет.
# Результат — ветка app-build (один коммит: pdd-pro-unsigned.aab для Google Play и pdd-pro-test.apk — пробный, подписан
# отладочным ключом, ставится на телефон для проверки) и артефакт запуска.
name: Приложение Android
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/app-android.yml']
permissions:
  contents: write
concurrency:
  group: app-android
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Проект Android
        run: |
          npm install --no-audit --no-fund
          npx cap add android
          cp -r res/. android/app/src/main/res/
          V=$(cat version.txt)
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"$V.${{ github.run_number }}\"/" android/app/build.gradle
          grep -E 'versionCode|versionName|applicationId' android/app/build.gradle
          npx cap sync android
      - name: Сборка AAB (без подписи) и пробного APK
        working-directory: app/android
        run: |
          ./gradlew --no-daemon bundleRelease assembleDebug
          mkdir -p ../../out
          cp app/build/outputs/bundle/release/app-release.aab ../../out/pdd-pro-unsigned.aab
          cp "$(ls app/build/outputs/apk/debug/*.apk | head -1)" ../../out/pdd-pro-test.apk
          echo "$(cat ../version.txt).${{ github.run_number }}" > ../../out/VERSION
          ls -la ../../out
      - uses: actions/upload-artifact@v4
        with:
          name: pdd-pro-unsigned
          path: out/
      - name: Ветка app-build
        working-directory: out
        run: |
          git init -q -b app-build
          git -c user.name=build -c user.email=build@localhost add -A
          git -c user.name=build -c user.email=build@localhost commit -q -m "Сборка $(cat VERSION) из ${GITHUB_SHA::8}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" app-build
